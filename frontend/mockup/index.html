<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Francis UTS · SCADA Emulator</title>

  <!-- CDNs -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.24/dist/uPlot.min.css">
  <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.24/dist/uPlot.iife.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Tailwind config -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            brand: {
              50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc',
              400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1',
              800: '#075985', 900: '#0c4a6e'
            }
          }
        }
      }
    };
  </script>

  <!-- Design system + components -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="h-screen flex flex-col overflow-hidden">

  <!-- ═══ HEADER: full-width con telemetry strip ═══ -->
  <header class="h-14 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 flex items-center justify-between shrink-0 z-30 shadow-sm">
    <div class="flex items-center gap-4 min-w-0">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-500 via-cyan-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-brand-500/25 ring-1 ring-white/20">
          <i class="fa-solid fa-water text-white text-sm"></i>
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5">
            <h1 class="text-sm font-extrabold tracking-tight text-slate-900 dark:text-white">FRANCIS UTS</h1>
            <span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-brand-100 dark:bg-brand-950 text-brand-700 dark:text-brand-400 border border-brand-200 dark:border-brand-800">v3.0</span>
          </div>
          <h2 id="view-title" class="text-[10px] text-slate-500 font-mono truncate">Monitor</h2>
        </div>
      </div>

      <div class="hidden xl:flex items-center gap-4 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 px-3 py-1 rounded-lg text-xs font-mono">
        <div class="flex items-center gap-1.5">
          <i class="fa-solid fa-gauge-high text-brand-500 text-[10px]"></i>
          <span class="text-slate-500">n:</span>
          <span id="top-rpm" class="font-bold text-slate-900 dark:text-white tabular">0</span>
          <span class="text-slate-400 text-[9px]">rpm</span>
        </div>
        <div class="w-px h-3 bg-slate-300 dark:bg-slate-700"></div>
        <div class="flex items-center gap-1.5">
          <i class="fa-solid fa-bolt text-amber-500 text-[10px]"></i>
          <span class="text-slate-500">P:</span>
          <span id="top-power" class="font-bold text-amber-600 dark:text-amber-400 tabular">0.0</span>
          <span class="text-slate-400 text-[9px]">W</span>
        </div>
        <div class="w-px h-3 bg-slate-300 dark:bg-slate-700"></div>
        <div class="flex items-center gap-1.5">
          <i class="fa-solid fa-faucet-drip text-cyan-500 text-[10px]"></i>
          <span class="text-slate-500">Q:</span>
          <span id="top-flow" class="font-bold text-cyan-600 dark:text-cyan-400 tabular">0.0</span>
          <span class="text-slate-400 text-[9px]">L/min</span>
        </div>
        <div class="w-px h-3 bg-slate-300 dark:bg-slate-700"></div>
        <div class="flex items-center gap-1.5">
          <i class="fa-solid fa-percent text-emerald-500 text-[10px]"></i>
          <span class="text-slate-500">η:</span>
          <span id="top-eta" class="font-bold text-emerald-600 dark:text-emerald-400 tabular">0</span>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <span id="plant-badge" class="hidden md:inline-flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700 text-[10px] font-bold px-2.5 py-1 rounded-full">
        <span class="status-dot off"></span> Detenida
      </span>
      <span id="mode-badge" class="hidden md:inline-flex items-center gap-1.5 bg-amber-50 dark:bg-amber-950 text-amber-700 dark:text-amber-400 border border-amber-200 dark:border-amber-800 text-[10px] font-bold px-2.5 py-1 rounded-full">
        <i class="fa-solid fa-hand"></i> Manual
      </span>

      <button onclick="FrancisSCADA.Controls.toggleSound()" id="btn-sound" title="Sonido" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 flex items-center justify-center text-xs"><i class="fa-solid fa-volume-low"></i></button>
      <button onclick="FrancisSCADA.UI.toggleTheme()" title="Tema" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 flex items-center justify-center text-xs"><i id="theme-icon" class="fa-solid fa-sun"></i></button>
      <button onclick="FrancisSCADA.Controls.exportCSV()" class="hidden sm:flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 text-xs font-semibold px-2.5 py-1.5 rounded-lg"><i class="fa-solid fa-file-csv text-emerald-500"></i>CSV</button>
      <button onclick="FrancisSCADA.Controls.toggleTrip()" id="btn-trip" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold px-3 py-2 rounded-lg shadow-sm flex items-center gap-1.5"><i class="fa-solid fa-triangle-exclamation"></i><span class="hidden sm:inline">Disparo</span></button>
    </div>
  </header>

  <!-- ═══ ALARM BANNER ═══ -->
  <div id="alarm-banner" class="hidden shrink-0 bg-rose-600 text-white px-4 py-2 flex items-center gap-3 text-xs font-semibold alarm-banner z-20">
    <i class="fa-solid fa-triangle-exclamation animate-bounce"></i>
    <span id="alarm-banner-msg" class="flex-1 font-mono">—</span>
    <button onclick="FrancisSCADA.Controls.acknowledgeAllAlarms()" class="bg-white/20 hover:bg-white/30 text-white text-[10px] font-bold px-3 py-1 rounded">RECONOCER</button>
  </div>

  <!-- ═══ BODY: sidebar + main ═══ -->
  <div class="flex-1 flex min-h-0 overflow-hidden">

    <!-- SIDEBAR 260px -->
    <aside class="w-[260px] bg-slate-900 border-r border-slate-800 flex flex-col shrink-0 z-20">
      <nav class="flex-1 p-2 space-y-0.5 overflow-y-auto" id="sidebar-nav">
      </nav>
      <div class="p-3 border-t border-slate-800 bg-slate-950/40 text-[11px] font-mono space-y-1.5">
        <div class="flex items-center justify-between">
          <span class="flex items-center gap-1.5 text-slate-400"><span class="status-dot ok pulse-dot"></span>Online</span>
          <span class="text-slate-500">30 Hz</span>
        </div>
        <div class="flex items-center justify-between text-slate-500"><span>Uptime</span><span id="uptime-label" class="text-slate-300">00:00:00</span></div>
        <div class="flex items-center justify-between text-slate-500"><span>Engine</span><span id="engine-mode-label" class="text-emerald-400">Mock</span></div>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 overflow-y-auto p-4 space-y-4">

      <!-- 6 KPIs (siempre visibles) -->
      <section class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3" id="kpi-grid">
      </section>

      <!-- View container -->
      <div id="view-container">
      </div>

    </main>
  </div>

  <!-- TOAST container -->
  <div id="toasts" class="fixed top-4 right-4 z-50 space-y-2 w-80 pointer-events-none"></div>

  <!-- ═══ SCRIPTS (order matters!) ═══ -->
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/engine-3d.js"></script>
  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
